name: Review Or Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed package version
        required: true
        type: string
      publish:
        description: Publish the reviewed tag to npm
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify the reviewed tag and version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/check-release.mjs
      - run: npm ci --ignore-scripts
      - name: Review dependency exposure and retain raw findings
        run: npm run review:dependencies
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-review
          path: |
            .local/dependency-audit.json
            .local/dependency-review.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - run: npm run verify
      - run: npm run scan
      - run: npm run test:integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-package
          path: |
            blackscaletech-n8n-nodes-swarm-${{ inputs.version }}.tgz
            blackscaletech-n8n-nodes-swarm-${{ inputs.version }}.tgz.sha256
          retention-days: 1
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: verify
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reviewed-package
          digest-mismatch: error
      - name: Publish only the reviewed version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          package="blackscaletech-n8n-nodes-swarm-${RELEASE_VERSION}.tgz"
          sha256sum --check --strict "${package}.sha256"
          npm publish "$package" --access public --provenance --ignore-scripts
